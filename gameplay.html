<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="gameplay.css">
    <script src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Fear Nexus</title>
</head>
<body onload="startGame()">
    <h1 class="Game-Title" style="font-family: 'Acme', sans-serif;"></h1>

<div id="game-container">
    <div id="ui-layer">
        <div class="ui-group health-group">
            <div class="abilities">
                <img src="images/ui/square.png" class="ability-icon ready" id="ab1">
                <img src="images/ui/square.png" class="ability-icon ready" id="ab2">
                <img src="images/ui/square.png" class="ability-icon ready" id="ab3">
            </div>
            <div class="bar-wrapper">
                <div class="icon">❤️</div>
                <div class="tube" id="health-tube">
                    <div class="fill health-fill" id="health-fill"></div>
                    <span class="bar-text" id="health-text">100/100</span>
                </div>
            </div>
        </div>

        <div class="ui-group magic-group">
            <div class="abilities">
                <img src="images/ui/triangle.png" class="ability-icon ready" id="ab4">
                <img src="images/ui/triangle.png" class="ability-icon ready" id="ab5">
                <img src="images/ui/triangle.png" class="ability-icon ready" id="ab6">
            </div>
            <div class="bar-wrapper">
                <div class="icon">💧</div>
                <div class="tube">
                    <div class="fill magic-fill" id="magic-fill"></div>
                    <span class="bar-text" id="magic-text">100/100</span>
                </div>
            </div>
        </div>
    </div>
    </div>

    <audio id="backgroundMusic"></audio>
    <script>
        const audioTracks = [
            "audio/music/Myuu-Grotesque-Fantasia.mp3",
            "audio/music/Myuu-Obsessions.mp3",
            "audio/music/Myuu-Countdown.mp3",
            "audio/music/Myuu-Collapse.mp3"
        ];
        const audio = document.getElementById("backgroundMusic");
        let hasStarted = false;

        function playRandomTrack() {
            const randomIndex = Math.floor(Math.random() * audioTracks.length);
            audio.src = audioTracks[randomIndex];
            audio.play().catch(error => console.error("Audio playback failed:", error));
        }

        audio.addEventListener("ended", playRandomTrack);
        document.addEventListener("click", () => {
            if (!hasStarted) {
                hasStarted = true;
                playRandomTrack();
            }
        });
    </script>

    <script src="js/config.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/character.js"></script>
    <script src="js/collisions.js"></script>
</body>
</html>
