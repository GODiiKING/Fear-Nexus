<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play the greatest battle arena in the world">
    <title>Fear Nexus - Game Guide</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Lexend+Exa:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="gameguide.css">
</head>

<body>

<style>
  .modalBackdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .modalContent {
    background: #1c1626;
    color: #ffffff;
    padding: 30px;
    border-radius: 8px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    font-family: sans-serif;
  }
  .modalContent h2 {
    margin-top: 0;
    color: #ffc048;
  }
  .modalContent p {
    line-height: 1.5;
    margin-bottom: 20px;
    color: #e0e0e0;
  }
  .modalContent button {
    background: #ff6b9d;
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
  }
  .modalContent button:hover {
    background: #ff85b3;
  }
</style>

<div id="disclaimerModal" class="modalBackdrop">
  <div class="modalContent">
    <h2>Notice</h2>
    <p>This game is in a very early skeleton phase, actively in development right now, and will receive updates in the future.</p>
    <button id="closeModalBtn">Got It</button>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const modal = document.getElementById("disclaimerModal");
    const button = document.getElementById("closeModalBtn");
    button.addEventListener("click", function() {
      modal.style.display = "none";
    });
  });
</script>    

<section class="content">

    <div class="controls-row">

        <div class="control">
            <div class="key">W</div>
            <p>Move Forward</p>
        </div>

        <div class="control">
            <div class="key">S</div>
            <p>Move Back</p>
        </div>

        <div class="control">
            <div class="mouse-icon">
                <div class="left"></div>
                <div class="right"></div>
            </div>
            <p>Shoot</p>
        </div>

        <div class="control">
            <div class="key">R</div>
            <p>Restart</p>
        </div>

    </div>

    <div class="button-container">
        <a href="gameplay.html" class="play-button">Play Now</a>
    </div>

</section>

<script src="js/main.js"></script>
</body>
</html>
