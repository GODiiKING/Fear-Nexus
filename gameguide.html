<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play the greatest battle arena in the world">
    <title>Fear Nexus - Game Guide</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Lexend+Exa:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="gameguide.css">
</head>

<body>

<section class="content">

    <div class="controls-row">

        <div class="control">
            <div class="key">W</div>
            <p>Move Forward</p>
        </div>

        <div class="control">
            <div class="key">S</div>
            <p>Move Back</p>
        </div>

        <div class="control">
            <div class="mouse-icon">
                <div class="left"></div>
                <div class="right"></div>
            </div>
            <p>Shoot</p>
        </div>

        <div class="control">
            <div class="key">R</div>
            <p>Restart</p>
        </div>

    </div>

    <div class="button-container">
        <a href="gameplay.html" class="play-button">Play Now</a>
    </div>

</section>

<script src="js/main.js"></script>
</body>
</html>
